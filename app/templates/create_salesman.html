<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Vendedor - Supervisor Hub</title>
    <script src="{{ url_for('static', filename='js/tailwind.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sweetalert2.js') }}"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-semibold text-gray-900">Supervisor Hub</h1>
                <a href="{{ url_for('dashboard.dashboard') }}" class="text-blue-600 hover:text-blue-800">← Volver al Panel</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Crear Nuevo Vendedor</h2>

            <form id="salesmanForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                    <input type="text" name="name" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Número de Cédula (CI) *</label>
                        <input type="text" name="client_id" id="client_id" required
                               pattern="[0-9]{7,10}" maxlength="10"
                               placeholder="12345678"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md">
                        <p class="text-xs text-gray-500 mt-1">7-10 dígitos</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Género *</label>
                        <select name="gender" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="">Seleccionar...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Número de Teléfono *</label>
                    <input type="tel" name="contact_number" id="contact_number" required
                           pattern="[0-9]{10,11}" maxlength="11"
                           placeholder="4121234567"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <p class="text-xs text-gray-500 mt-1">10-11 dígitos (sin espacios ni guiones)</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" name="email"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Provincia *</label>
                        <select name="province" id="province" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="">Seleccionar provincia...</option>
                            {% for province in provinces %}
                            <option value="{{ province.name }}">{{ province.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ciudad *</label>
                        <select name="city" id="city" required disabled
                                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100">
                            <option value="">Seleccione provincia primero...</option>
                            {% for city in cities %}
                            <option value="{{ city.name }}" data-province="{{ city.province.name }}">{{ city.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit"
                            class="w-full px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                        Crear Vendedor (Pendiente de Aprobación)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('salesmanForm');
        const provinceSelect = document.getElementById('province');
        const citySelect = document.getElementById('city');

        provinceSelect.addEventListener('change', () => {
            const selectedProvince = provinceSelect.value;
            const cityOptions = citySelect.querySelectorAll('option');

            if (selectedProvince) {
                citySelect.disabled = false;
                citySelect.classList.remove('bg-gray-100');

                cityOptions.forEach(option => {
                    if (option.value === '') {
                        option.style.display = 'block';
                        option.textContent = 'Seleccionar ciudad...';
                    } else {
                        const provinceMatch = option.dataset.province === selectedProvince;
                        option.style.display = provinceMatch ? 'block' : 'none';
                    }
                });
            } else {
                citySelect.disabled = true;
                citySelect.classList.add('bg-gray-100');
                cityOptions[0].textContent = 'Seleccione provincia primero...';
            }

            citySelect.value = '';
        });

        const clientIdInput = document.getElementById('client_id');
        const contactNumberInput = document.getElementById('contact_number');

        clientIdInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        contactNumberInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const clientId = clientIdInput.value;
            if (clientId.length < 7 || clientId.length > 10) {
                Swal.fire({
                    icon: 'error',
                    title: 'Cédula Inválida',
                    text: 'La cédula debe tener entre 7 y 10 dígitos'
                });
                return;
            }

            const contactNumber = contactNumberInput.value;
            if (contactNumber.length < 10 || contactNumber.length > 11) {
                Swal.fire({
                    icon: 'error',
                    title: 'Teléfono Inválido',
                    text: 'El teléfono debe tener 10 u 11 dígitos'
                });
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/salesmen/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Vendedor Creado!',
                        text: 'Pendiente de aprobación.',
                        confirmButtonColor: '#16a34a'
                    }).then(() => {
                        window.location.href = '/dashboard';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: result.error
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Error al crear vendedor'
                });
            }
        });
    </script>
</body>
</html>
