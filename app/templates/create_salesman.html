<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Salesman - HONOR Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-xl font-semibold text-gray-900">HONOR Hub</h1>
                <a href="{{ url_for('dashboard.dashboard') }}" class="text-blue-600 hover:text-blue-800">← Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">Create New Salesman</h2>
            
            <form id="salesmanForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input type="text" name="name" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID Number *</label>
                        <input type="text" name="client_id" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
                        <select name="gender" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="">Select...</option>
                            <option value="M">Male</option>
                            <option value="F">Female</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input type="tel" name="contact_number" required placeholder="4121234567"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Province *</label>
                        <select name="province" id="province" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="">Select province...</option>
                            {% for province in provinces %}
                            <option value="{{ province.name }}">{{ province.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City *</label>
                        <select name="city" id="city" required disabled
                                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-gray-100">
                            <option value="">Select province first...</option>
                            {% for city in cities %}
                            <option value="{{ city.name }}" data-province="{{ city.province.name }}">{{ city.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" 
                            class="w-full px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                        Create Salesman (Pending Approval)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('salesmanForm');
        const provinceSelect = document.getElementById('province');
        const citySelect = document.getElementById('city');
        
        // Filter cities by selected province
        provinceSelect.addEventListener('change', () => {
            const selectedProvince = provinceSelect.value;
            const cityOptions = citySelect.querySelectorAll('option');
            
            if (selectedProvince) {
                // Enable city dropdown
                citySelect.disabled = false;
                citySelect.classList.remove('bg-gray-100');
                
                // Filter cities
                cityOptions.forEach(option => {
                    if (option.value === '') {
                        option.style.display = 'block';
                        option.textContent = 'Select city...';
                    } else {
                        const provinceMatch = option.dataset.province === selectedProvince;
                        option.style.display = provinceMatch ? 'block' : 'none';
                    }
                });
            } else {
                // Disable city dropdown
                citySelect.disabled = true;
                citySelect.classList.add('bg-gray-100');
                cityOptions[0].textContent = 'Select province first...';
            }
            
            // Reset city selection
            citySelect.value = '';
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/api/salesmen/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Salesman Created!',
                        text: 'Pending admin approval.',
                        confirmButtonColor: '#16a34a'
                    }).then(() => {
                        window.location.href = '/dashboard';
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: result.error
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Failed to create salesman'
                });
            }
        });
    </script>
</body>
</html>
