<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <script src="{{ url_for('static', filename='js/tailwind.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sweetalert2.js') }}"></script>
  <title>Supervisor Hub - Login</title>
  <style>
    input { font-size: 16px; }
    .swal2-popup { font-size: 0.95rem; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div class="flex-1 w-full flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-md p-6">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600 mb-2">Supervisor Hub</h1>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-md {% if category == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif category == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="space-y-6">
      <div>
        <label for="id" class="block text-sm font-medium text-gray-700 mb-1">ID de Empleado</label>
        <input type="text" id="id" name="id"
               placeholder="Ingresa tu ID de empleado"
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
               required>
        <p class="text-xs text-gray-500 mt-1">Ingresa tu ID único (ej: aw0000)</p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="password" name="password"
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
               required>
      </div>

      <div class="flex items-center justify-between">
        <button type="submit"
                class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          Iniciar Sesión
        </button>
      </div>
    </form>
    </div>
  </div>

  <footer class="mt-auto w-full text-center text-xs text-gray-500 py-4">
    <div>Supervisor Hub &mdash; Sistema de Gestión de Asignaciones Retail</div>
  </footer>

  <script>
    const Toast = Swal.mixin({
      toast: true,
      position: 'top-end',
      showConfirmButton: false,
      timer: 3500,
      timerProgressBar: true
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('id').focus();
    });

    document.querySelector('form').addEventListener('submit', function(e) {
      const userId = document.getElementById('id').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!userId) {
        e.preventDefault();
        Toast.fire({ icon: 'error', title: 'Por favor ingresa tu ID de empleado' });
        document.getElementById('id').focus();
        return;
      }

      if (!password) {
        e.preventDefault();
        Toast.fire({ icon: 'error', title: 'Por favor ingresa tu contraseña' });
        document.getElementById('password').focus();
        return;
      }
    });
  </script>
</body>
</html>
